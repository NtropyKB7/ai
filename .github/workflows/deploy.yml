name: Deploy to EC2

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: SSH and Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ENV_FILE
          script: |
            # 1. EC2 내의 app 작업 디렉터리 생성 및 이동
            mkdir -p ~/app
            cd ~/app

            # 2. .git 존재 여부 확인 후 최신 코드 동기화
            if [ ! -d ".git" ]; then
              git clone -b develop https://github.com/NtropyKB7/ai.git .
            else
              git checkout develop
              git pull origin develop
            fi

            # 3. GitHub Secrets에서 주입받은 환경변수를 .env 파일로 동적 생성
            echo "$ENV_FILE" > .env

            # 4. 기존 컨테이너 중지(첫 배포 시 에러 방지 || true) 및 재빌드 실행
            docker-compose down || true
            docker-compose up --build -d
